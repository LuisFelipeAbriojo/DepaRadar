[project]
name = "deparadar"
version = "0.1.0"
description = "Radar de departamentos bajo precio y flujo de caja de alquiler en Lima Moderna"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deparadar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
