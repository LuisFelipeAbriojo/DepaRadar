[project]
name = "deparadar"
version = "0.1.0"
description = "Radar de departamentos bajo precio y flujo de caja de alquiler en Lima Moderna"
requires-python = ">=3.11"
dependencies = [
    "folium>=0.20.0",
    "google-genai>=3.0.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "streamlit-folium>=0.27.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deparadar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
