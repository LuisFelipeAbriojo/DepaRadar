# Actualiza los avisos, los atributos de Gemini, los modelos y las tasas del BCRP
# todos los días. Si hay datos nuevos, hace commit a main y Streamlit Cloud se
# redespliega solo.
#
# Requiere el secreto GEMINI_API_KEY (Settings → Secrets and variables → Actions).
# Sin él, igual actualiza los avisos, pero los nuevos van sin atributos de Gemini.

name: Actualizar datos

on:
  schedule:
    - cron: "0 11 * * *"   # 6:00 a. m. de Lima (UTC-5)
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano
    inputs:
      max_paginas:
        description: "Páginas por distrito y operación (21 avisos c/u)"
        default: "5"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Scraping, Gemini, modelos y BCRP
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m deparadar.actualizar --max-paginas "${{ github.event.inputs.max_paginas || '5' }}"

      - name: Tests
        run: uv run pytest -q

      - name: Commit de los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "data: actualización diaria $(date -u +%Y-%m-%d)"
            git push
          fi
